[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "xoder-ai"
version = "0.2.2"
description = "Xoder, a readable Pi-style terminal coding agent and reusable Python harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "packaging>=24.0",
    "pydantic>=2.0",
    "pygments>=2.18",
    "rich>=13.0",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/BANGHlxbackout/Xoder"
Repository = "https://github.com/BANGHlxbackout/Xoder"
Issues = "https://github.com/BANGHlxbackout/Xoder/issues"

[project.scripts]
xoder = "xoder_coding.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xoder_ai", "src/xoder_agent", "src/xoder_coding"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/workflows/ci.yml",
    "/.gitignore",
    "/.python-version",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/examples",
    "/pyproject.toml",
    "/src/xoder_ai",
    "/src/xoder_agent",
    "/src/xoder_coding",
    "/tests",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xoder_ai", "xoder_agent", "xoder_coding"]

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
